<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Card Tycoon: Rips &amp; Rarity</title>
<style>
:root{--bg:#0a0d15;--panel:#131828;--panel2:#1a2138;--line:#2a3454;--txt:#e8ecf5;--dim:#8b93a7;--acc:#ffd166;--blue:#5bc0eb;--rad:14px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100dvh;position:relative;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
#hud{position:sticky;top:0;z-index:25;display:flex;gap:6px;padding:10px 10px 14px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,#0a0d15 78%,rgba(10,13,21,0))}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:800;display:flex;gap:5px;align-items:center;white-space:nowrap}
.pill .sub{font-weight:600;color:var(--dim);font-size:10.5px}
main{padding:2px 12px}
.tab{display:none;animation:fin .16s ease}
.tab.on{display:block}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#0d1120f5;border-top:1px solid #232b47;z-index:30}
#nav button{flex:1;background:none;border:0;color:var(--dim);padding:8px 0 calc(8px + env(safe-area-inset-bottom));font-size:10px;font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center}
#nav button i{font-style:normal;font-size:20px;filter:grayscale(.6)}
#nav button.on{color:var(--acc)}
#nav button.on i{filter:none}
h2{font-size:16px;margin:14px 2px 2px}
.sub{color:var(--dim);font-size:11.5px;margin:0 2px 8px}
.btn{display:block;width:100%;border:0;border-radius:var(--rad);padding:13px;font-size:15px;font-weight:800;font-family:inherit;background:linear-gradient(135deg,#ffd166,#f4a259);color:#231a05;box-shadow:0 4px 0 #b07a2c;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b07a2c}
.btn.blue{background:linear-gradient(135deg,#5bc0eb,#3b82f6);color:#06121f;box-shadow:0 4px 0 #245a9e}
.btn.purp{background:linear-gradient(135deg,#c084fc,#8b5cf6);color:#150a26;box-shadow:0 4px 0 #5b3594}
.btn.big{font-size:17px;padding:17px}
.btn.ghost{background:var(--panel2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:10px}
.btn:disabled{filter:grayscale(.9);opacity:.45}
.row{display:flex;gap:8px}.row>*{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:12px;margin-bottom:10px}
.prod{display:flex;flex-direction:column;gap:7px}
.prod .top{display:flex;justify-content:space-between;align-items:center}
.prod .nm{font-weight:900;font-size:15px}
.prod .tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.prod .odds{font-size:10.5px;color:var(--dim);line-height:1.5;background:#0d1220;border:1px solid #1e2740;border-radius:9px;padding:7px 9px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 1px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.chip.on{background:var(--acc);color:#231a05;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{position:relative;aspect-ratio:5/7;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#2a3352,#141a2e);border:2px solid var(--rc,#8f97a3);display:flex;flex-direction:column;font-size:10px;flex:1}
.card .cn{padding:5px 7px 3px;font-weight:800;font-size:10.5px;display:flex;justify-content:space-between;gap:4px;z-index:3;line-height:1.1}
.card .art{flex:1;margin:4px;border-radius:8px;overflow:hidden;position:relative}
.card .art svg{width:100%;height:100%;display:block}
.card .cf{padding:4px 7px 6px;display:flex;justify-content:space-between;color:var(--dim);font-size:9.5px;z-index:3}
.card.fullart .art{position:absolute;inset:0;margin:0;border-radius:0}
.card.fullart .cn,.card.fullart .cf{background:linear-gradient(180deg,rgba(5,8,18,.78),rgba(5,8,18,.28));backdrop-filter:blur(1.5px)}
.card.fullart .cf{background:linear-gradient(0deg,rgba(5,8,18,.78),rgba(5,8,18,.28))}
.card .cnt{position:absolute;top:3px;left:5px;background:#000b;border-radius:8px;padding:1px 6px;font-size:9px;z-index:4;font-weight:800}
.rc-C{--rc:#8f97a3}.rc-UC{--rc:#3ecf8e}.rc-R{--rc:#35b6ff}.rc-HR{--rc:#c44dff}.rc-UR{--rc:#ffb340}.rc-SR{--rc:#ff5e9e}
.rc-UR{box-shadow:0 0 10px rgba(255,179,64,.35)}
.rc-SR{box-shadow:0 0 14px rgba(255,94,158,.5);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(255,94,158,.4)}50%{box-shadow:0 0 20px rgba(255,94,158,.75)}}
.holo::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.55) 47%,transparent 58%),linear-gradient(300deg,rgba(94,234,212,.28),rgba(192,132,252,.28),rgba(251,191,36,.28));background-size:320% 320%,220% 220%;animation:shine 2.7s linear infinite;pointer-events:none;mix-blend-mode:screen}
.secret::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(70deg,rgba(255,94,158,.35),rgba(255,209,102,.35),rgba(124,242,156,.35),rgba(91,192,235,.35),rgba(192,132,252,.35),rgba(255,94,158,.35)),linear-gradient(115deg,transparent 25%,rgba(255,255,255,.6) 47%,transparent 58%);background-size:420% 420%,320% 320%;animation:shine 2.2s linear infinite,rainbow 5s linear infinite;pointer-events:none;mix-blend-mode:screen}
@keyframes shine{0%{background-position:240% 0,240% 0}100%{background-position:-140% 0,-140% 0}}
@keyframes rainbow{0%{background-position:0 0,240% 0}100%{background-position:420% 0,-140% 0}}
.pr-base{--pc:#8f97a3}.pr-silver{--pc:#dfe5ee}.pr-n99{--pc:#22c55e}.pr-n49{--pc:#3b82f6}.pr-n25{--pc:#fb923c}.pr-n10{--pc:#ef4444}.pr-n5{--pc:#facc15}.pr-n1{--pc:#e9edf5}.pr-auto{--pc:#c084fc}.pr-rcauto{--pc:#fb7185}.pr-legauto{--pc:#facc15}
.card.sport{border-color:var(--pc)}
.card.sport .pbanner{position:absolute;left:0;right:0;bottom:22px;background:var(--pc);color:#0a0d15;font-weight:900;font-size:9px;text-align:center;padding:2px 0;letter-spacing:.5px;z-index:3}
.pr-silver{background:linear-gradient(160deg,#e6ebf3,#97a0b3)}
.pr-n1{background:#05070c}
.pr-n1 .pbanner{background:#fff;color:#000;outline:2px solid #facc15}
.jnum{position:absolute;inset:auto 0 18% 0;text-align:center;font-size:42px;font-weight:900;color:#fff;text-shadow:0 2px 0 #00000055,0 0 14px #0008;z-index:2}
.sig{width:72%;margin:0 auto;display:block}
.auto-tag{color:#f6d365;font-weight:900}
.sig-bg{position:absolute;left:6%;right:6%;top:44%;height:20%;background:#fdfdf6;border-radius:4px;transform:rotate(-4deg);z-index:3;box-shadow:0 2px 6px #0006;display:flex;align-items:center;justify-content:center}
.foil-stripe::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 46%,transparent 56%);background-size:300% 300%;animation:shine 3.2s linear infinite;pointer-events:none;mix-blend-mode:screen}
.card.locked{background:var(--panel2);border-color:var(--line);align-items:center;justify-content:center;display:flex;color:#3a4560;font-size:26px;font-weight:900}
.modal{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:60;background:rgba(4,6,12,.93);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{width:100%;max-height:93dvh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 12px 20px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.pix{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.pick{width:31%;min-width:96px;cursor:pointer}
.pick .back{aspect-ratio:5/7;border-radius:12px;background:repeating-linear-gradient(45deg,#1a2138 0 10px,#141a2e 10px 20px);border:2px solid #3b4770;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#ffd16688;font-size:24px;font-weight:900}
.pick .back span{font-size:9px;letter-spacing:2px;color:#ffd16655;font-weight:800}
.flip{animation:flip .4s ease}
@keyframes flip{0%{transform:rotateY(90deg) scale(.88)}100%{transform:none}}
.pkhead{display:flex;justify-content:space-between;align-items:center}
.pkhead .t{font-weight:900;font-size:16px}
.sum{background:#0d1220;border:1px solid #1e2740;border-radius:12px;padding:10px;font-size:12px;line-height:1.6;display:none}
.sum.on{display:block}
.hi{color:var(--acc);font-weight:900}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-16px);background:#15203a;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:800;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 6px 24px #0009}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.uprow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:10px;margin-bottom:8px}
.uprow .ic{font-size:24px;flex:0 0 40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:10px}
.uprow .info{flex:1;min-width:0}
.uprow .info .n{font-weight:800;font-size:13px}
.uprow .info .d{font-size:11px;color:var(--dim)}
.uprow .info .lv{font-size:10px;color:var(--acc);font-weight:800}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 2px;border-bottom:1px dashed #1e2740}
.kv b{color:var(--acc)}
.bar{height:8px;background:#0d1220;border-radius:99px;overflow:hidden;border:1px solid #1e2740}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5bc0eb,#c084fc);border-radius:99px}
.logbox{background:#0d1220;border:1px solid #1e2740;border-radius:12px;padding:9px;font-size:11.5px;line-height:1.75;color:var(--dim);max-height:150px;overflow-y:auto}
.logbox .hl{color:var(--txt)}
.stand{position:relative;text-align:center;padding:18px 12px;margin-bottom:10px;background:radial-gradient(ellipse at 50% 120%,rgba(255,209,102,.14),transparent 65%),var(--panel);border:1px solid var(--line);border-radius:18px}
.stand .cps{font-size:26px;font-weight:900;color:var(--acc)}
.stand .lb{font-size:11px;color:var(--dim);letter-spacing:1px;font-weight:800}
.tap-all{position:absolute;inset:0;border-radius:18px;cursor:pointer;z-index:1}
.stand .row{position:relative;z-index:2}
#tapFx{position:fixed;z-index:80;pointer-events:none;font-weight:900;color:var(--acc);font-size:18px;opacity:0}
.pedia .card .art{background:var(--panel2)}
.badge{font-size:8.5px;font-weight:900;padding:1px 5px;border-radius:5px;background:#ef4444;color:#fff;margin-left:3px}
.badge.leg{background:#facc15;color:#231a05}
.detailwrap{display:flex;justify-content:center;margin:10px 0}
.detailwrap .card{width:200px;flex:none}
</style>
</head>

function pickW(pairs){const t=pairs.reduce((a,p)=>a+p[1],0);let r=Math.random()*t;for(const p of pairs){r-=p[1];if(r<=0)return p[0]}return pairs[pairs.length-1][0]}

function sigSVG(seed){
 const R=mulberry32(seed^0x9e37);let d=`M6 28`;let x=6,y=28;

 return `<svg viewBox="0 0 90 42" class="sig"><path d="${d}" stroke="#17233f" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>`}

function cardVal(cid){const[k,a,b]=cid.split(":");
 if(k==="t")return RART[b].v;
 return PARS[b].v*TIERV[PLAYERS[+a].t]}
function playOf(pid){return PLAYERS[+pid]}
function shardVal(cid){const[k,a,b]=cid.split(":");
 if(k==="t")return RART[b].sh;
 return PARS[b].sh}
function setBonusT(){let el={};for(const m of MONSTERS)el[m.e]=(el[m.e]||0);for(const cid in S.cards){const[k,a]=cid.split(":");if(k==="t")el[MONSTERS[+a].e]=(el[MONSTERS[+a].e]||0)+1}
 let owned={};for(const cid in S.cards){const[k,a]=cid.split(":");if(k==="t"){const m=MONSTERS[+a];owned[m.e]=owned[m.e]||new Set();owned[m.e].add(m.id)}}
 let tot={};for(const m of MONSTERS)tot[m.e]=(tot[m.e]||0)+1;
 let b=1;for(const e in tot)if(owned[e]&&owned[e].size===tot[e])b+=.15;
 let all=0;for(const e in tot)if(owned[e])all+=owned[e].size;if(all===MONSTERS.length)b+=.5;
 return b}
function setBonusS(){let per=[0,0,0,0],cnt=[24,24,24,24];const seen=[new Set(),new Set(),new Set(),new Set()];
 for(const cid in S.cards){const[k,a,b]=cid.split(":");if(k==="s")seen[PLAYERS[+a].s].add(+a)}
 let b=1,tot=0;for(let i=0;i<4;i++){tot+=seen[i].size;if(seen[i].size===cnt[i])b+=.15}
 if(tot===96)b+=.5;return b}
function cps(){let t=0,s=0;for(const cid in S.cards){const[k,a,b]=cid.split(":");
  if(k==="t")t+=RART[b].v;else s+=PARS[b].v*TIERV[PLAYERS[+a].t]}
 t*=1+.25*(S.ups.stand||0);t*=setBonusT();s*=1+.25*(S.ups.venue||0);s*=setBonusS();
 return(t+s)*(1+.2*(S.ups.hype||0))*(1+.3*S.lp)}
function luckMul(){return 1+.12*(S.ups.luck||0)+.02*S.lp}

/* ===== PACK RIPPING ===== */
function tcgSlot(kind){if(kind!=="H"&&kind!=="H2"&&kind!=="HX")return kind;
 const L=luckMul(),t=kind==="H"?HIT_S:kind==="H2"?HIT_E:HIT_X;
 const adj=t.map(([r,w])=>[r,r==="R"?w:w*L]);return pickW(adj)}
function spSlot(kind){const L=luckMul();
 const t=kind==="H"?SHIT_R:kind==="C1"?SCOLOR:kind==="H2"?SHIT_H:SAUTO;
 const adj=t.map(([r,w])=>[r,(r==="silver"||r==="auto")?w:w*L]);return pickW(adj)}
function pickPlayer(par){let tiers;
 if(par==="rcauto")tiers=["Rookie"];else if(par==="legauto")tiers=["Legend"];
 else if(par==="auto")tiers=[pickW([["Star",50],["Rookie",30],["Legend",20]])];
 else tiers=[pickW([["Star",46],["Prospect",24],["Legend",15],["Rookie",15]])];
 const pool=PLAYERS.filter(p=>tiers.includes(p.t));return pool[Math.random()*pool.length|0]}
function addCard(cid){let dup=false,sh=0;
 if(S.cards[cid]){dup=true;sh=Math.round(shardVal(cid)*(1+.3*(S.ups.bulk||0)));S.shards+=sh;S.dupes++}
 S.cards[cid]=(S.cards[cid]||0)+1;
 return{dup,sh}}
function rip(pack,silent){
 const cost=pack.cost,res=[];let shardsGain=0,newN=0,bestV=-1,bestDesc="";
 if(pack.cur==="coins"){if(S.coins<cost)return null;S.coins-=cost}else{if(S.shards<cost)return null;S.shards-=cost}
 const isTcg=TCGPACKS.includes(pack);
 for(const slot of pack.slots){
  let cid,rarLabel;
  if(isTcg){const rar=tcgSlot(slot);const mi=Math.random()*MONSTERS.length|0;cid=`t:${mi}:${rar}`;rarLabel=RART[rar].l}
  else{const par=slot==="B"?"base":spSlot(slot);const p=pickPlayer(par);cid=`s:${p.id}:${par}`;rarLabel=PARS[par].l+" \u00B7 "+p.n}
  const c=addCard(cid);shardsGain+=c.sh;if(!c.dup){newN++;S.newCards++}
  const v=cardVal(cid);if(v>bestV){bestV=v;bestDesc=rarLabel}
  if(cid.endsWith(":SR"))S.secrets++;if(cid.endsWith(":n1"))S.ones++;if(cid.includes("auto"))S.autoshit++;
  res.push({cid,dup:c.dup,sh:c.sh,html:cardHTML(cid,false)});
 }
 S.opened++;if(shardsGain)log(`Dupes converted: <span class="hl">+${shardsGain} shards</span>`);
 if(bestV>=6)log(`Hit! <span class="hl">${bestDesc}</span> from ${pack.n}`);
 if(!silent)showPack(pack,res,shardsGain,newN,bestDesc);
 else if(bestV>=18)toast(`Auto-rip hit: ${bestDesc}`);
 return res}
let PK=null;
function showPack(pack,res,sh,newN,best){
 PK={res,open:res.map(()=>false),name:pack.n,sh,newN,best};

function upCost(u){const lv=S.ups[u.k]||0;return Math.ceil(u.b*Math.pow(u.g,lv))}
function buyUp(k){const u=UPS.find(x=>x.k===k),lv=S.ups[k]||0;if(lv>=u.max)return;
 const c=upCost(u);if(u.cur==="coins"){if(S.coins<c)return;S.coins-=c}else{if(S.shards<c)return;S.shards-=c}
 S.ups[k]=lv+1;toast(`${u.n} \u2192 Lv.${lv+1}`);renderAll()}
function lpGain(){return Math.floor(Math.sqrt(S.life/100000))}
function prestige(){const g=lpGain();if(g<1||S.life<2e5){toast("Earn more lifetime coins to start a New Season.");return}
 if(!confirm(`Start a New Season? Your cards and coins reset, but you gain ${g} Legend Points (+30% all income, +2% luck each).`))return;
 S.lp+=g;S.coins=250;S.shards=Math.floor(S.shards/2);S.cards={};S.ups={};S.autoA=false;S.autoS=false;
 log(`New Season started. <span class="hl">+${g} Legend Points</span>`);toast(`New Season! +${g} LP`);renderAll();save()}

const home=renderHome;renderHome=()=>{home();$('#t-home').insertAdjacentHTML('afterbegin','<div class="sub">Card Tycoon v3.1 · Only display cards earn. Manage spares from Binder.</div>');$('#t-home').insertAdjacentHTML('beforeend','<h2>Active display</h2><div class="grid">'+S.lineup.map(k=>'<div onclick="showCard(\''+k+'\')">'+cardHTML(k,false)+'</div>').join('')+'</div>')};
finishPack=()=>{$('#pkSum').classList.add('on');$('#pkSum').innerHTML=PK.newN+' new · '+PK.res.filter(c=>c.dup).length+' spares to stock. Only displayed cards earn.';renderHUD()};const rv=reveal;reveal=(i,q)=>{rv(i,q);if(PK.res[i].dup){const e=$('#pk'+i+' .cnt');if(e)e.textContent='SPARE'}};
UPS.forEach(u=>{u.d=({stand:'+8% monster display income',venue:'+8% sports display income',hype:'+4% display income',luck:'Luck disabled to preserve harsh chase odds',bulk:'Retired duplicate-shard upgrade'})[u.k]||u.d;if(['luck','bulk'].includes(u.k))u.max=S.ups[u.k]||0});lpGain=()=>Math.floor(Math.sqrt(Math.max(0,S.life-S.base)/100000));prestige=()=>{const n=lpGain();if(!n)return toast('Earn 100K this season');if(!confirm('Reset collection, grades and upgrades for '+n+' LP (+8% income each)?'))return;S.lp+=n;S.base=S.life;S.cards={};S.stock={};S.grades={};S.lineup=[];S.ups={};S.job=null;S.coins=250;S.shards=Math.floor(S.shards/2);S.autoA=false;S.autoS=false;save();renderAll()};const sh=renderShop;renderShop=()=>{sh();$('#t-shop').innerHTML=$('#t-shop').innerHTML.replace('+30% income and +2% luck','+8% income').replace('needs 250K+ lifetime','needs 100K this season')};
const sp=spCard;spCard=(k,c)=>sp(k,c).replace('>HOF<','>LEG<');const art=monsterSVG;monsterSVG=(id,full)=>{let s=art(id,full);if(id%8===0)return s;const h=ELEMENTS[MONSTERS[id].e].h,a=['','M35 152Q153 188 142 112Q66 55 47 114Q89 151 152 74','M86 146L20 65 76 85 100 41 125 85 180 55 119 151Z','M60 70L140 70 155 130 130 170 70 170 45 130Z','M24 110Q95 43 149 103L185 78 177 119 188 152 149 135Q77 176 24 110Z','M55 159Q20 70 89 45Q164 31 147 138L179 165 137 159 105 180 79 158 51 177Z','M77 158L18 47 76 73 99 25 127 76 185 40 139 161Z','M30 90L55 60 145 60 170 90 145 165 55 165Z'];return s.slice(0,s.indexOf('<ellipse cx="100" cy="176"'))+'<path d="'+a[id%8]+'" fill="'+(id%8===1?'none':'hsl('+h+',65%,52%)')+'" stroke="hsl('+h+',60%,25%)" stroke-width="'+(id%8===1?18:4)+'" stroke-linejoin="round"/><circle cx="100" cy="100" r="7" fill="white"/><circle cx="102" cy="101" r="3" fill="#182338"/></svg>'};
const goals=[['First rip','opened',1],['25 packs','opened',25],['250 packs','opened',250],['1000 packs','opened',1000],['Secret','secrets',1],['One of one','ones',1],['Auto','autoshit',1],['10K coins','life',10000],['Million coins','life',1000000],['Sale','sales',1],['10 sales','sales',10],['100 sales','sales',100],['Gem','gems',1],['Recycler','recycled',1],['5 recycles','recycled',5],['New season','lp',1],['10 secrets','secrets',10],['10 autos','autoshit',10]];const more=renderMore;renderMore=()=>{more();$('#t-more').innerHTML=$('#t-more').innerHTML.replace('sports legends use real HOF names; rookies/prospects are fictional','all players fictional · v3.1');$('#t-more').insertAdjacentHTML('afterbegin','<h2>Achievements · 10 shards each</h2><div class="panel">'+goals.map(([n])=>'<div class="kv">'+(S.ach[n]?'✓ ':'○ ')+n+'</div>').join('')+'</div>')};
setInterval(()=>{if(S.job&&Date.now()>=S.job.end){const g=pickW([[1,1],[2,3],[3,4],[4,6],[5,9],[6,15],[7,20],[8,20],[9,16],[10,6]]);S.grades[S.job.k]=Math.max(g,S.grades[S.job.k]||0);if(g===10)S.gems++;toast('Grading returned: TGC '+g);S.job=null}for(const[n,k,t]of goals)if(S[k]>=t&&!S.ach[n]){S.ach[n]=true;S.shards+=10}},1000);setInterval(tick,1000);setInterval(save,5000);renderAll();save();
