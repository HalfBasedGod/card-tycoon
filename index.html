<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Card Tycoon 3</title><style>body{margin:0;background:#101525;color:#ecedf8;font:15px system-ui}main{max-width:480px;margin:auto;padding:16px 12px 90px}header{position:sticky;top:0;background:#101525;padding:12px;z-index:9}button,select{background:#273552;color:white;border:1px solid #566688;border-radius:10px;padding:12px;margin:4px}button:disabled{opacity:.35}nav{position:fixed;bottom:0;background:#101525;width:100%;text-align:center;padding:8px 0;z-index:9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:2px solid var(--color);border-radius:12px;overflow:hidden;background:#1c2843;position:relative}.card svg{width:100%;display:block}.name{padding:5px;font-size:11px}small{color:#aebbd5}.panel{background:#1a2439;border-radius:12px;padding:12px;margin:10px 0}.full{background:linear-gradient(135deg,#633887,#235471)}.full svg{background:linear-gradient(150deg,#ad657955,#6589ef55)}h2{font-size:18px}.gold{color:#ffd16a}</style><main><header id="hud"></header><div id="view"></div></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id),elements=['Fire','Water','Nature','Electric','Earth','Air','Shadow','Light','Metal','Psychic'],colors=['#ef7352','#55bbed','#78cf88','#eccc57','#c99362','#a8dded','#a889cf','#fbe5a0','#abbacf','#d590e9'];
const roots=['Ember','Tide','Moss','Volt','Stone','Gale','Dusk','Dawn','Iron','Dream'],ends=['cub','fang','wing','coil','claw','horn','fin','moth','drake','wisp','tusk'];
const monsters=Array.from({length:104},(_,i)=>({id:i,name:roots[i%10]+ends[Math.floor(i/10)],element:i%10}));
const first=['Silas','Dorian','Corbin','Rafael','Asa','Tavian','Bram','Lucan','Orin','Cedric','Evren','Nolan','Kellan','Ronan','Ivo','Soren','Malachi','Alden','Cassian','Tobin','Leander','Emrys','Davin','Quentin'];
const players=Array.from({length:96},(_,i)=>({id:i,name:first[i%24]+' '+['Calder','Vescari','Hollis','Merrow'][Math.floor(i/24)],sport:Math.floor(i/24),tier:['Legend','Star','Rookie','Prospect'][Math.floor(i%24/6)]}));
const tiersT=['Common','Uncommon','Rare','Holo','Full Art','Secret'],tiersS=['Base','Silver','/99','/49','/25','/10','/5','1/1','Auto','RC Auto','Legend Auto'];
const incomeT=[.025,.055,.12,.28,.65,1.5],incomeS=[.025,.065,.13,.21,.35,.55,.85,1.6,.4,.7,1.2];
const fresh=()=>({coins:250,shards:0,life:0,baseline:0,lp:0,cards:{},line:[],grades:{},job:null,ach:{},opened:0,sold:0,recycled:0,gems:0,last:Date.now(),market:{epoch:0,orders:3}});
let S=fresh(),tab='Home',notice='';try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem('ct3'))||{})}catch(e){}
function save(){S.last=Date.now();localStorage.setItem('ct3',JSON.stringify(S))}
function mig(){if(localStorage.getItem('ct3'))return;try{const raw=localStorage.getItem('cardtycoon_v1');if(!raw)return;localStorage.setItem('ct3_backup_v1',raw);const o=JSON.parse(raw),tm=['C','UC','R','HR','UR','SR'],sm=['base','silver','n99','n49','n25','n10','n5','n1','auto','rcauto','legauto'];for(const [k,v]of Object.entries(o.cards||{})){const[c,id,r]=k.split(':');const t=(c==='t'?tm:sm).indexOf(r);if(t>=0)S.cards[c+':'+id+':'+t]=Math.max(1,Math.min(v,1+(o.stock?.[k]||0)))}S.coins=o.coins||250;S.shards=o.shards||0;S.life=o.life||0;S.baseline=S.life;S.lp=o.lp||0;S.opened=o.opened||0;S.line=Object.keys(S.cards).sort((a,b)=>rate(b)-rate(a)).slice(0,10);notice='Old save backed up. Collection and currency migrated; unspent duplicates only.'}catch(e){notice='Old save retained separately.'}}
function rate(k){const[c,id,t]=k.split(':');return (c==='t'?incomeT:incomeS)[+t]}
function cps(){return S.line.filter(k=>S.cards[k]>0).reduce((a,k)=>a+rate(k)*(S.grades[k]===10?2:S.grades[k]===9?1.3:1),0)*(1+.08*S.lp)}
function weighted(w){let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){r-=w[i];if(r<0)return i}return w.length-1}
function label(k){const[c,id,t]=k.split(':');return (c==='t'?monsters:players)[+id].name+' · '+(c==='t'?tiersT:tiersS)[+t]}
function art(i,c){const hue=colors[i%10],kind=i%8;let shape=[`<path d="M25 83L38 49 75 55 94 35 114 55 104 89 86 88 83 72 53 72 46 90Z"/>`,`<path d="M26 91Q101 111 95 69Q25 32 36 73Q79 107 105 36" fill="none" stroke-width="16"/>`,`<path d="M63 87L15 32 58 47 73 20 88 47 134 28 94 88Z"/>`,`<ellipse cx="75" cy="64" rx="32" ry="36"/><path d="M46 49L17 30M43 70L10 70M51 90L20 109M104 49L133 30M107 70L140 70M99 90L130 109M75 32V98" fill="none"/>`,`<path d="M18 70Q68 15 113 63L141 43 131 73 142 98 114 86Q59 112 18 70Z"/>`,`<path d="M38 105Q19 31 73 21Q130 19 114 91L135 110 98 102 73 119 53 101Z"/>`,`<path d="M65 105L20 36 60 54 75 15 93 55 136 29 102 106Z"/>`,`<ellipse cx="75" cy="79" rx="35" ry="22"/><path d="M43 78L18 51 12 18 33 29 31 53M107 78L132 51 138 18 117 29 119 53M48 92L27 118M102 92L123 118" fill="none"/>`][kind];if(c==='s')shape=`<path d="M40 23L60 15 90 15 110 23 135 48 117 67 103 52 103 115 47 115 47 52 33 67 15 48Z"/><text x="75" y="85" text-anchor="middle" fill="white" stroke="none" font-size="32">${i%97+1}</text>`;return `<svg viewBox="0 0 150 135"><circle cx="${25+i%90}" cy="24" r="17" fill="${hue}" opacity=".18"/><path d="M0 130L35 98 67 123 103 88 150 130" fill="${hue}" opacity=".15"/><g fill="${hue}" stroke="#111d35" stroke-width="4" stroke-linejoin="round">${shape}</g>${c==='t'?'<circle cx="78" cy="52" r="5" fill="white"/><circle cx="79" cy="53" r="2" fill="#142238"/>':''}</svg>`}
function card(k){const[c,id,t]=k.split(':');return `<div class="card ${c==='t'&&t>=4?'full':''}" style="--color:${colors[+t%10]}"><div class="name">${label(k)}</div>${art(+id,c)}<div class="name">${S.cards[k]} copies · ${rate(k)}/s ${S.grades[k]?' · Grade '+S.grades[k]:''}</div><button onclick="line('${k}')">${S.line.includes(k)?'Remove':'Display'}</button></div>`}
function line(k){if(S.line.includes(k))S.line=S.line.filter(x=>x!==k);else if(S.line.filter(x=>x[0]===k[0]).length<5)S.line.push(k);else notice='Five slots per category. Remove a displayed card first.';render();save()}
function add(k){S.cards[k]=(S.cards[k]||0)+1;if(S.line.filter(x=>x[0]===k[0]).length<5&&!S.line.includes(k))S.line.push(k)}
function rip(c,elite){const cost=c==='t'?(elite?750:100):(elite?1100:300);if(S.coins<cost)return;S.coins-=cost;let pulls=[];for(let j=0;j<(elite?8:5);j++){let t=j===4?weighted(c==='t'?(elite?[0,0,0,94,5.5,.5]:[0,0,97,2.5,.45,.05]):[0,70,18,7,3,1,.2,.01,.65,.12,.02]):c==='t'?weighted([80,20]):0;let id=Math.random()*(c==='t'?104:96)|0;if(c==='s'&&t===9)id=Math.floor(id/24)*24+12+id%6;if(c==='s'&&t===10)id=Math.floor(id/24)*24+id%6;const k=c+':'+id+':'+t;add(k);pulls.push(label(k))}S.opened++;notice=pulls.join(' / ');render();save()}
function market(){const epoch=Math.floor(Date.now()/60000);if(S.market.epoch!==epoch)S.market={epoch,orders:3}}
function price(k){let h=0;for(const x of k)h=(h*31+x.charCodeAt(0))>>>0;return Math.max(1,Math.floor(rate(k)*120*(.7+((h+S.market.epoch*37)%61)/100)*.88))}
function sell(k){market();if(S.cards[k]<2||S.market.orders<1)return;S.cards[k]--;S.market.orders--;S.coins+=price(k);S.sold++;render();save()}
function grade(k){if(S.job||S.cards[k]<2||S.coins<150)return;S.coins-=150;S.cards[k]--;S.job={k,end:Date.now()+180000};render();save()}
function recycle(k){const[c,id,t]=k.split(':');if(S.cards[k]<21||+t>=(c==='t'?3:4))return;S.cards[k]-=20;add(c+':'+(Math.random()*(c==='t'?104:96)|0)+':'+(+t+1));S.recycled++;render();save()}
function season(){const n=Math.floor(Math.sqrt((S.life-S.baseline)/100000));if(n<1)return;if(!confirm('Reset collection and coins for '+n+' LP?'))return;S.lp+=n;S.baseline=S.life;S.cards={};S.line=[];S.grades={};S.job=null;S.coins=250;S.shards=Math.floor(S.shards/2);render();save()}
function render(){market();$('hud').textContent='Card Tycoon 3 · '+Math.floor(S.coins)+' coins · '+S.shards+' shards · '+cps().toFixed(2)+'/s';const ks=Object.keys(S.cards);let v=`<p class="gold">${notice}</p>`;if(tab==='Home')v+=`<h2>Display lineup</h2><small>Only displayed cards earn. Five monsters + five players maximum. Selling duplicates never creates shards.</small><button onclick="S.coins++;render()">Hustle +1</button><div class="grid">${S.line.map(card).join('')}</div><h2>New season</h2><button onclick="season()">Prestige (+${Math.floor(Math.sqrt((S.life-S.baseline)/100000))} LP)</button>`;if(tab==='Packs')v+=`<h2>Published hit odds</h2><small>Monster Starter: Rare 97%, Holo 2.5%, Full Art 0.45%, Secret 0.05%. One hit per pack. Hobby: autos combined 0.79%, 1/1 0.01% per hit. No pity or luck boosts.</small><p><button onclick="rip('t',false)">Monster · 100</button><button onclick="rip('t',true)">Monster Box · 750</button><button onclick="rip('s',false)">Sports · 300</button><button onclick="rip('s',true)">Hobby · 1100</button></p>`;if(tab==='Binder')v+=`<h2>Collection · ${ks.length} variants</h2><div class="grid">${ks.map(card).join('')}</div>`;if(tab==='Market')v+=`<h2>Market & grading</h2><small>${S.market.orders} buyer orders left this minute · 12% fee included. Grading: 150 coins, 180s, 6% Gem 10. Best grade replaces the display copy multiplier; it does not stack.</small>${S.job?'<p>Grading in progress: '+Math.max(0,Math.ceil((S.job.end-Date.now())/1000))+'s</p>':''}${ks.filter(k=>S.cards[k]>1).map(k=>`<div class="panel">${label(k)} · ${S.cards[k]-1} spares<br><button onclick="sell('${k}')">Sell ${price(k)} coins</button><button onclick="grade('${k}')">Grade</button><button onclick="recycle('${k}')">Recycle 20 spares</button></div>`).join('')}`;if(tab==='More')v+=`<h2>Milestones</h2>${Object.keys(S.ach).map(k=>'<p>✓ '+k+'</p>').join('')}<p>${S.opened} packs · ${S.sold} singles sold · ${S.gems} Gem grades · ${S.recycled} recycles</p><h2>Directory</h2><small>104 monsters, 96 fictional players. Artwork uses eight creature anatomies with individual colors and motifs.</small><button onclick="save()">Save</button>`;$('view').innerHTML=v}
$('nav').innerHTML=['Home','Packs','Binder','Market','More'].map(t=>`<button onclick="tab='${t}';render()">${t}</button>`).join('');mig();S.coins+=cps()*Math.min(7200,Math.max(0,(Date.now()-S.last)/1000));render();setInterval(()=>{const x=cps();S.coins+=x;S.life+=x;if(S.job&&S.job.end<=Date.now()){const g=weighted([1,3,4,6,9,15,20,20,16,6])+1;S.grades[S.job.k]=Math.max(S.grades[S.job.k]||0,g);if(g===10)S.gems++;notice=label(S.job.k)+' returned Grade '+g;S.job=null}for(const[n,ok]of [['First pack',S.opened>=1],['25 packs',S.opened>=25],['First sale',S.sold>=1],['Gem mint',S.gems>=1],['Recycler',S.recycled>=1]])if(ok&&!S.ach[n]){S.ach[n]=true;S.shards+=10}$('hud').textContent='Card Tycoon 3 · '+Math.floor(S.coins)+' coins · '+S.shards+' shards · '+cps().toFixed(2)+'/s'},1000);setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
</script></html>
