name: Build tested Card Tycoon 3.2
on:
  push:
    paths: ['.github/workflows/update-v32.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate features into existing interface
        env:
          UPDATE: 
        run: |
          python3 - <<'PY'
          import subprocess,base64,zlib,os
          assert subprocess.check_output(['git','rev-parse','HEAD:index.html']).decode().strip()=='65a59d9d72a6d65600c0f2db4df0b74657e17d62','Unexpected base version'
          s=open('index.html').read()
          changes={
            'const isTcg=TCGPACKS.includes(pack);':"const isTcg=pack.kind==='t'||TCGPACKS.includes(pack);",
            'const mi=Math.random()*MONSTERS.length|0;':"const choices=pack.pool||MONSTERS;const mi=choices[Math.random()*choices.length|0].id;",
            'function pickPlayer(par){':'function pickPlayer(par,sport){',
            'PLAYERS.filter(p=>tiers.includes(p.t))':'PLAYERS.filter(p=>tiers.includes(p.t)&&(sport===undefined||p.s===sport))',
            'const p=pickPlayer(par);':'const p=pickPlayer(par,pack.sport);',
            'const g=pickW([[1,1]':'const g=S.job.grade??pickW([[1,1]'
          }
          for a,b in changes.items():
              assert a in s,a
              s=s.replace(a,b)
          update=zlib.decompress(base64.b64decode(os.environ['UPDATE'])).decode()
          s=s.replace('</body>','<script>'+update+'</script></body>')
          open('index.html','w').write(s)
          PY
      - name: Install mobile WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - name: Test each feature and navigation
        run: |
          python3 -m http.server 8765 > /tmp/server32.log 2>&1 &
          cat > /tmp/test32.cjs <<'JS'
          const {webkit}=require(process.cwd()+'/node_modules/playwright'),fs=require('fs');
          (async()=>{const browser=await webkit.launch(),page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true}),errors=[];page.on('pageerror',e=>errors.push(e.message));await page.goto('http://localhost:8765/index.html');await page.waitForSelector('#standTap');if(await page.evaluate(()=>fmt(.025))!=='0.025')throw Error('precision');await page.locator('[data-t="t-packs"]').tap();await page.locator('#t-packs .prod button').first().tap();await page.getByRole('button',{name:'Reveal All',exact:true}).tap();await page.getByRole('button',{name:'Collection',exact:true}).tap();
          const result=await page.evaluate(()=>{S.coins=2000;CT32.open(CT32.themes.findIndex(p=>p.n==='Water Frontier'));const water=CT32.data().history[0].cards.every(k=>MONSTERS[+k.split(':')[1]].e==='Water');revealAll();closePack();CT32.open(CT32.themes.findIndex(p=>p.n==='Baseball Spotlight'));const sport=CT32.data().history[0].cards.every(k=>PLAYERS[+k.split(':')[1]].s===0);revealAll();closePack();for(const k in S.stock)S.stock[k]=0;const ks=MONSTERS.filter(m=>m.e==='Water').slice(0,3).map(m=>'t:'+m.id+':C');for(const k of ks){S.cards[k]=2;S.stock[k]=1}CT32.data().contracts={epoch:-1,done:[]};const coins=S.coins;CT32.fulfill(0);const contract=S.coins>coins&&ks.every(k=>S.cards[k]===1)&&CT32.contracts()[0].done;const k='t:0:C';S.coins=2000;S.cards[k]=2;S.stock[k]=1;S.job=null;CT32.data().quality[k]=[['Centering','Corners','Edges','Surface'].map(n=>({n,v:95}))];CT31.grade(k);const grading=S.job&&S.job.subgrades.every(x=>x.v===95)&&S.cards[k]===1;S.job.grade=10;S.job.end=Date.now()-1;return {water,sport,contract,grading,history:CT32.data().history.length===3}});if(Object.values(result).some(v=>!v))throw Error(JSON.stringify(result));await page.waitForFunction(()=>S.grades['t:0:C']===10);await page.getByRole('button',{name:'Close',exact:true}).tap();await page.locator('[data-t="t-extra32"]').tap();for(const name of ['Contracts','Grading','Trophies','History'])await page.getByRole('button',{name,exact:true}).tap();for(const t of ['t-binder','t-shop','t-more','t-home'])await page.locator('[data-t="'+t+'"]').tap();await page.screenshot({path:'game-v32-mobile.png',fullPage:true});await page.reload();await page.waitForSelector('#standTap');if(errors.length)throw Error(errors.join(';'));fs.writeFileSync('release-v32-test.json',JSON.stringify({version:'3.2',browser:'WebKit',mobileTouch:true,precision:true,packReveal:true,collectorScreens:true,navigation:true,saveReload:true,...result,errors},null,2));await browser.close()})().catch(e=>{fs.writeFileSync('release-v32-test.json',JSON.stringify({passed:false,error:e.message},null,2));console.error(e);process.exit(1)});
          JS
          node /tmp/test32.cjs
      - name: Publish only passing build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html game-v32-mobile.png release-v32-test.json
          git commit -m 'Publish tested Card Tycoon 3.2: precision, contracts, themes, condition, trophies and history'
          git push
      - name: Record failures without replacing game
        if: failure()
        run: |
          if [ -f release-v32-test.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add release-v32-test.json
            git diff --cached --quiet || git commit -m 'Record v3.2 browser test failure'
            git push
          fi
