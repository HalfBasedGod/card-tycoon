name: Build polished preview
on:
  push:
    paths: ['.github/workflows/polished-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original and build preview
        env:
          PATCH: 
        run: |
          python3 - <<'PY'
          import os,base64,zlib,subprocess,re
          source=subprocess.check_output(['git','show','9379ebfb86633e4d80958039f4a476829e3a096b:index.html']).decode()
          source=source.replace('init();','load();')
          patch=zlib.decompress(base64.b64decode(os.environ['PATCH'])).decode()
          result=source.replace('</body>','<script>'+patch+'</script></body>')
          open('preview.html','w').write(result)
          open('/tmp/check.js','w').write(';\n'.join(re.findall(r'<script>(.*?)</script>',result,re.S)))
          subprocess.run(['node','--check','/tmp/check.js'],check=True)
          PY
      - name: Commit preview only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview.html
          git diff --cached --quiet || git commit -m 'Build polished v3.1 preview'
          git push
